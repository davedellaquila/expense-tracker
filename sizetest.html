<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>fullw test</title>
<style>
/* copied verbatim from index.html */
label.f{display:block; font-size:13px; font-weight:600; color:#666; margin:12px 0 5px;}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=month],input[type=url],select,textarea{
  width:100%; font-size:16px; padding:10px 12px; border:1px solid #ccc;
  border-radius:10px; background:#fff; color:#111; font-family:inherit; box-sizing:border-box;}
.sheet.fitfields input[type=text],.sheet.fitfields input[type=number],.sheet.fitfields input[type=date],
.sheet.fitfields select,.sheet.fitfields textarea{width:auto; max-width:100%;}
.sheet.fitfields input.fullw,.sheet.fitfields select.fullw,.sheet.fitfields textarea.fullw{width:100%;}
.sheet{max-width:560px; margin:0 auto; padding:16px;}
</style></head>
<body>
<div class="sheet fitfields" id="form">
  <h2>Edit transaction</h2>
  <label class="f">Date</label><input type="date" value="2026-09-29">
  <label class="f">Merchant</label><input type="text" class="fullw" value="Tst*Pjs Roadhouse Placerville CA">
  <label class="f">Description</label><input type="text" class="fullw" value="Dinner with the crew">
  <label class="f">Amount</label><input type="number" value="33.00">
  <label class="f">Category</label><select><option>Dining Out</option></select>
  <label class="f">Payment method</label><select class="fullw"><option>Wells Fargo xxxxxx8345</option></select>
  <label class="f">Bank</label><select><option>Wells Fargo</option></select>
  <label class="f">Notes</label><textarea class="fullw">Optional</textarea>
</div>
<script>
var r = [];
document.querySelectorAll('#form input, #form select, #form textarea').forEach(function(n){
  var w = n.getBoundingClientRect().width, fw = n.classList.contains('fullw');
  var label = n.previousElementSibling ? n.previousElementSibling.textContent : '?';
  r.push(label + ': ' + Math.round(w) + 'px' + (fw ? ' [fullw]' : ''));
});
document.title = r.join(' | ');
</script>
</body></html>
