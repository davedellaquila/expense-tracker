<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>autogrow test</title>
<style>
:root{--border:#ccc;--input-bg:#fff;--text:#111;--muted:#666;--blue:#06c;--blue-soft:#bcd}
body{font-family:-apple-system,sans-serif;max-width:600px;margin:20px auto;padding:0 16px;}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 5px;}
input[type=text],select,textarea{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--input-bg);color:var(--text);font-family:inherit;box-sizing:border-box;}
textarea{resize:vertical;min-height:64px;}
textarea.autogrow{min-height:0;resize:none;overflow:hidden;}
.sheet.fitfields textarea.fullw{width:100%;}
</style></head><body>
<div class="sheet fitfields">
<label class="f">Merchant (long)</label>
<textarea id="m1" rows="1" class="fullw"></textarea>
<label class="f">Description (long)</label>
<textarea id="d1" rows="1" class="fullw"></textarea>
<label class="f">Notes (long)</label>
<textarea id="n1" rows="2" class="fullw"></textarea>
<label class="f">Merchant (short)</label>
<textarea id="m2" rows="1" class="fullw"></textarea>
</div>
<script>
function autoGrowTextarea(ta,maxH){
  maxH=maxH||160; ta.classList.add('autogrow');
  function fit(){ ta.style.height='auto'; var h=ta.scrollHeight;
    if(h>0){ ta.style.height=Math.min(h,maxH)+'px'; ta.style.overflowY=h>maxH?'auto':'hidden'; } }
  ta.addEventListener('input',fit); requestAnimationFrame(fit); setTimeout(fit,50); return ta;
}
document.querySelectorAll('textarea').forEach(function(t){ autoGrowTextarea(t); });
document.getElementById('m1').value='NYTIMES DISC*800-698-4637NY DAVE DELLAQUILA #4715: Total Transactions $441.72 - a very long merchant name that should wrap to multiple lines';
document.getElementById('d1').value='Purchase authorized on 08/15/2026 for $42.50 at some store with a really long description that goes on and on and on and on';
document.getElementById('n1').value='Line one of notes\nLine two of notes\nLine three of notes\nLine four - this is getting long enough to test the cap behavior eventually but not yet';
document.getElementById('m2').value='Costco';
setTimeout(function(){
  document.querySelectorAll('textarea').forEach(function(t){
    t.style.height='auto'; var h=t.scrollHeight;
    if(h>0){ t.style.height=Math.min(h,160)+'px'; }
  });
},100);
</script></body></html>
